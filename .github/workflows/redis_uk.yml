name: Проверка Python и Redis

on:
  push:
    paths:
      - "Big_Data_redis/load_to_redis.py"
      - "Big_Data_redis/requirements.txt"
      - "Big_Data_redis/start_redis.sh"
      - "Big_Data_redis/capture_evidence.sh"
      - ".devcontainer/**"
      - ".github/workflows/redis_uk.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Установить библиотеки Python
        run: python -m pip install -r Big_Data_redis/requirements.txt
      - name: Загрузить и проверить хэши через Python
        run: python Big_Data_redis/load_to_redis.py
      - name: Проверить данные через redis-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools
          redis-cli --raw ping
          echo "Количество хэшей:"
          count=$(redis-cli --scan --pattern 'uk:org:*' | wc -l)
          echo "$count"
          test "$count" -eq 1343
          sample_key=$(redis-cli --scan --pattern 'uk:org:*' | sort | sed -n '1p')
          test "$(redis-cli TYPE "$sample_key")" = hash
          echo "redis-cli --raw HGETALL $sample_key"
          redis-cli --raw HGETALL "$sample_key"
      - name: Сделать скриншоты кода и терминала
        run: |
          sudo apt-get install -y xvfb xterm x11-apps imagemagick fonts-dejavu-core
          bash Big_Data_redis/capture_evidence.sh
      - name: Сохранить скриншоты запуска
        uses: actions/upload-artifact@v7
        with:
          name: python-redis-screenshots
          path: Big_Data_redis/screenshots/*.png
